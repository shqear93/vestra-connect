<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:26px 30px}
  .scale{display:flex;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-default)}
  .sw{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw b{font-family:var(--font-mono);font-size:10px;font-weight:500}
  .cap{display:flex;justify-content:space-between;margin:0 0 12px}
  .ttl{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--fg-strong)}
  .sub{font-size:13px;color:var(--fg-muted)}
  .hex{display:flex;margin-top:8px}
  .hex span{flex:1;font-family:var(--font-mono);font-size:9.5px;color:var(--fg-subtle);text-align:center}
</style></head>
<body>
  <div class="cap"><span class="ttl">Gold — premium &amp; investor</span><span class="sub">Used sparingly · 500 primary</span></div>
  <div class="scale">
    <div class="sw" style="background:var(--gold-700)"><b style="color:#fff">700</b></div>
    <div class="sw" style="background:var(--gold-600)"><b style="color:#fff">600</b></div>
    <div class="sw" style="background:var(--gold-500)"><b style="color:#2A2620">500 ★</b></div>
    <div class="sw" style="background:var(--gold-400)"><b style="color:#2A2620">400</b></div>
    <div class="sw" style="background:var(--gold-300)"><b style="color:#2A2620">300</b></div>
    <div class="sw" style="background:var(--gold-200)"><b style="color:#2A2620">200</b></div>
    <div class="sw" style="background:var(--gold-100)"><b style="color:#2A2620">100</b></div>
    <div class="sw" style="background:var(--gold-50)"><b style="color:#2A2620">50</b></div>
  </div>
  <div class="hex"><span>#8C6E2E</span><span>#A8853A</span><span>#C2A24E</span><span>#D4B96E</span><span>#E4D29A</span><span>#EFE3C2</span><span>#F6EEDA</span><span>#FAF5E9</span></div>
</body></html>
