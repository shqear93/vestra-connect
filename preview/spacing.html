<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:28px 30px}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);display:block;margin:0 0 16px}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:11px}
  .bar{height:18px;background:var(--accent);border-radius:4px}
  .nm{font-family:var(--font-mono);font-size:11px;color:var(--fg-strong);width:70px;flex:none}
</style></head>
<body>
  <span class="tag">Spacing scale · 4px base</span>
  <div class="row"><span class="nm">1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="nm">2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="nm">3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="nm">4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="nm">6 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="nm">8 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="nm">12 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="nm">16 · 64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="nm">20 · 80</span><div class="bar" style="width:80px"></div></div>
</body></html>
