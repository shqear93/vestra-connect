<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:34px 30px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .item{text-align:center}
  .box{width:96px;height:70px;background:var(--bg-surface);border-radius:14px;margin-bottom:14px}
  .nm{font-family:var(--font-mono);font-size:11px;color:var(--fg-strong);font-weight:500}
</style></head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="nm">xs</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">sm</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="nm">md</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="nm">lg</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="nm">xl</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-emerald);background:var(--accent)"></div><div class="nm">emerald</div></div>
</body></html>
