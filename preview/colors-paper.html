<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:26px 30px}
  .scale{display:flex;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-default)}
  .sw{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw b{font-family:var(--font-mono);font-size:10px;font-weight:500}
  .cap{display:flex;justify-content:space-between;margin:0 0 12px}
  .ttl{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--fg-strong)}
  .sub{font-size:13px;color:var(--fg-muted)}
  .hex{display:flex;margin-top:8px}
  .hex span{flex:1;font-family:var(--font-mono);font-size:9.5px;color:var(--fg-subtle);text-align:center}
</style></head>
<body>
  <div class="cap"><span class="ttl">Warm Paper / Neutrals</span><span class="sub">Canvas · cards · hairlines</span></div>
  <div class="scale">
    <div class="sw" style="background:var(--paper-900)"><b style="color:#fff">900</b></div>
    <div class="sw" style="background:var(--paper-700)"><b style="color:#fff">700</b></div>
    <div class="sw" style="background:var(--paper-500)"><b style="color:#fff">500</b></div>
    <div class="sw" style="background:var(--paper-300)"><b style="color:#2A2620">300</b></div>
    <div class="sw" style="background:var(--paper-200)"><b style="color:#2A2620">200</b></div>
    <div class="sw" style="background:var(--paper-150)"><b style="color:#2A2620">150</b></div>
    <div class="sw" style="background:var(--paper-50)"><b style="color:#2A2620">50</b></div>
    <div class="sw" style="background:var(--surface-warm);border-right:1px solid var(--border-default)"><b style="color:#2A2620">warm</b></div>
    <div class="sw" style="background:var(--white)"><b style="color:#2A2620">white</b></div>
  </div>
  <div class="hex"><span>#2A2620</span><span>#4A453C</span><span>#837B6E</span><span>#CFC7B8</span><span>#E4DDD1</span><span>#EFE9E0</span><span>#F6F2EC</span><span>#FCFAF6</span><span>#FFFFFF</span></div>
</body></html>
