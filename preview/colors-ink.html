<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:26px 30px}
  .scale{display:flex;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-default)}
  .sw{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw b{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.02em}
  .cap{display:flex;justify-content:space-between;margin:0 0 12px}
  .ttl{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--fg-strong)}
  .sub{font-size:13px;color:var(--fg-muted)}
  .hex{display:flex;margin-top:8px}
  .hex span{flex:1;font-family:var(--font-mono);font-size:9.5px;color:var(--fg-subtle);text-align:center}
</style></head>
<body>
  <div class="cap"><span class="ttl">Ink / Navy</span><span class="sub">Trust · text · dark surfaces</span></div>
  <div class="scale">
    <div class="sw" style="background:var(--ink-950)"><b style="color:#fff">950</b></div>
    <div class="sw" style="background:var(--ink-900)"><b style="color:#fff">900</b></div>
    <div class="sw" style="background:var(--ink-800)"><b style="color:#fff">800</b></div>
    <div class="sw" style="background:var(--ink-700)"><b style="color:#fff">700</b></div>
    <div class="sw" style="background:var(--ink-600)"><b style="color:#fff">600</b></div>
    <div class="sw" style="background:var(--ink-400)"><b style="color:#fff">400</b></div>
    <div class="sw" style="background:var(--ink-200)"><b style="color:#102A43">200</b></div>
    <div class="sw" style="background:var(--ink-100)"><b style="color:#102A43">100</b></div>
    <div class="sw" style="background:var(--ink-50)"><b style="color:#102A43">50</b></div>
  </div>
  <div class="hex"><span>#081826</span><span>#0C2236</span><span>#102A43</span><span>#173A57</span><span>#244E6E</span><span>#5A819C</span><span>#BFD0DB</span><span>#DEE7EE</span><span>#EEF3F7</span></div>
</body></html>
