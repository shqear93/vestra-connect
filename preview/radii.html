<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:28px 30px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
  .item{text-align:center}
  .box{width:84px;height:64px;background:var(--bg-surface);border:1px solid var(--border-default);box-shadow:var(--shadow-sm);margin-bottom:10px}
  .nm{font-family:var(--font-mono);font-size:11px;color:var(--fg-strong);font-weight:500}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle)}
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="nm">xs</div><div class="px">6px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="nm">sm</div><div class="px">8px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="nm">md</div><div class="px">12px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="nm">lg</div><div class="px">16px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="nm">xl</div><div class="px">20px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="nm">2xl</div><div class="px">28px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:64px"></div><div class="nm">pill</div><div class="px">999px</div></div>
</body></html>
