<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:26px 30px}
  .scale{display:flex;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-default)}
  .sw{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw b{font-family:var(--font-mono);font-size:10px;font-weight:500}
  .cap{display:flex;justify-content:space-between;margin:0 0 12px}
  .ttl{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--fg-strong)}
  .sub{font-size:13px;color:var(--fg-muted)}
  .hex{display:flex;margin-top:8px}
  .hex span{flex:1;font-family:var(--font-mono);font-size:9.5px;color:var(--fg-subtle);text-align:center}
  .star{font-size:10px;color:var(--accent)}
</style></head>
<body>
  <div class="cap"><span class="ttl">Emerald — opportunity &amp; growth</span><span class="sub">600 is the primary accent ★</span></div>
  <div class="scale">
    <div class="sw" style="background:var(--emerald-900)"><b style="color:#fff">900</b></div>
    <div class="sw" style="background:var(--emerald-800)"><b style="color:#fff">800</b></div>
    <div class="sw" style="background:var(--emerald-700)"><b style="color:#fff">700</b></div>
    <div class="sw" style="background:var(--emerald-600)"><b style="color:#fff">600 ★</b></div>
    <div class="sw" style="background:var(--emerald-500)"><b style="color:#fff">500</b></div>
    <div class="sw" style="background:var(--emerald-300)"><b style="color:#073B2B">300</b></div>
    <div class="sw" style="background:var(--emerald-200)"><b style="color:#073B2B">200</b></div>
    <div class="sw" style="background:var(--emerald-100)"><b style="color:#073B2B">100</b></div>
    <div class="sw" style="background:var(--emerald-50)"><b style="color:#073B2B">50</b></div>
  </div>
  <div class="hex"><span>#073B2B</span><span>#0A5640</span><span>#0B6B4F</span><span>#0E7C5A</span><span>#15936C</span><span>#79C9AC</span><span>#B4E2D2</span><span>#DBF1E8</span><span>#ECF7F2</span></div>
</body></html>
