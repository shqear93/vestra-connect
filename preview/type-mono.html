<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:28px 32px;display:flex;gap:36px;flex-wrap:wrap}
  .blk{flex:1;min-width:240px}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle);display:block;margin:0 0 14px}
  .eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:block}
  .data{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
  .num{font-family:var(--font-mono);font-weight:600;font-size:34px;color:var(--fg-strong);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .unit{font-family:var(--font-mono);font-size:13px;color:var(--fg-muted)}
  .pill{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-700);background:var(--bg-inset);border:1px solid var(--border-default);border-radius:999px;padding:5px 12px;margin:0 6px 8px 0}
</style></head>
<body>
  <div class="blk">
    <span class="tag">IBM Plex Mono — data</span>
    <span class="eyebrow">Readiness signal</span>
    <div class="data"><span class="num">82</span><span class="unit">/ 100</span></div>
    <div class="data"><span class="num">JOD&nbsp;45K</span><span class="unit">ask</span></div>
    <div class="data"><span class="num">3</span><span class="unit">verified signals</span></div>
  </div>
  <div class="blk">
    <span class="tag">Eyebrows &amp; mono tags</span>
    <span class="pill">Verified project</span>
    <span class="pill">University</span>
    <span class="pill">Tech</span>
    <span class="pill">Small business</span>
    <span class="pill">Seeking intro</span>
  </div>
</body></html>
