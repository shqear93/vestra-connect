<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:28px 32px;}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border-subtle);padding:14px 0;}
  .row:last-child{border-bottom:0}
  .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);width:130px;flex:none}
  .spec{font-family:var(--font-display);color:var(--fg-strong);line-height:1;letter-spacing:-.02em}
</style></head>
<body>
  <div class="row"><span class="lbl">Display · 600</span><span class="spec" style="font-size:52px">Where projects meet opportunity</span></div>
  <div class="row"><span class="lbl">H1 · 600</span><span class="spec" style="font-size:38px">Jordan's trusted network</span></div>
  <div class="row"><span class="lbl">H2 · 500</span><span class="spec" style="font-size:28px;font-weight:500">Credible projects, real introductions</span></div>
  <div class="row"><span class="lbl">Spectral italic</span><span class="spec" style="font-size:26px;font-style:italic;font-weight:400">Built for serious projects.</span></div>
</body></html>
