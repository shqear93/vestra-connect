<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:26px 32px;color:var(--fg-default)}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle);display:block;margin:0 0 16px}
  .specimen{font-size:60px;line-height:1;letter-spacing:-.02em;color:var(--fg-strong);margin:0 0 18px}
  .row{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
  .w{display:flex;flex-direction:column;gap:5px}
  .w b{font-size:26px;color:var(--fg-strong);line-height:1}
  .w span{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle)}
</style></head>
<body>
  <span class="tag">Proxima Nova — brand sans · self-hosted · full family</span>
  <p class="specimen">Trust, opportunity &amp; connection</p>
  <div class="row">
    <div class="w"><b style="font-weight:100">Aa 123</b><span>Thin · 100</span></div>
    <div class="w"><b style="font-weight:300">Aa 123</b><span>Light · 300</span></div>
    <div class="w"><b style="font-weight:400">Aa 123</b><span>Regular · 400</span></div>
    <div class="w"><b style="font-weight:500">Aa 123</b><span>Medium · 500</span></div>
    <div class="w"><b style="font-weight:600">Aa 123</b><span>Semibold · 600</span></div>
    <div class="w"><b style="font-weight:700">Aa 123</b><span>Bold · 700</span></div>
    <div class="w"><b style="font-weight:800">Aa 123</b><span>Extrabold · 800</span></div>
    <div class="w"><b style="font-weight:900">Aa 123</b><span>Black · 900</span></div>
  </div>
</body></html>
