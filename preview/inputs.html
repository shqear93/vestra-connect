<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:26px 30px;display:flex;gap:22px;flex-wrap:wrap}
  .col{flex:1;min-width:250px;display:flex;flex-direction:column;gap:16px}
  label{display:block;font-size:13px;font-weight:600;color:var(--fg-strong);margin-bottom:7px}
  .field{position:relative}
  .input{width:100%;box-sizing:border-box;font-family:var(--font-sans);font-size:15px;color:var(--fg-strong);background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:11px 13px;outline:none;transition:all var(--dur-base) var(--ease-out)}
  .input::placeholder{color:var(--fg-subtle)}
  .input.focus{border-color:var(--accent);box-shadow:var(--shadow-focus)}
  .hint{font-size:12px;color:var(--fg-subtle);margin-top:6px}
  .sel{display:flex;gap:8px;margin-top:2px}
  .chip{font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--bg-surface);color:var(--fg-muted);cursor:pointer}
  .chip.on{background:var(--emerald-50);border-color:var(--emerald-300);color:var(--emerald-800);font-weight:600}
</style></head>
<body>
  <div class="col">
    <div class="field"><label>Project name</label><input class="input" value="Solar microgrid for rural clinics"></div>
    <div class="field"><label>Funding ask (JOD)</label><input class="input focus" value="45,000"><div class="hint">Focused state — 3px emerald ring</div></div>
  </div>
  <div class="col">
    <div class="field"><label>Email</label><input class="input" placeholder="you@company.jo"><div class="hint">Placeholder &amp; resting state</div></div>
    <div>
      <label>Category</label>
      <div class="sel">
        <span class="chip on">University</span>
        <span class="chip">Small business</span>
        <span class="chip">Tech</span>
      </div>
    </div>
  </div>
</body></html>
