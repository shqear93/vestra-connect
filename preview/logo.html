<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-canvas);font-family:var(--font-sans);padding:30px 32px;display:flex;align-items:center;gap:40px}
  .mark{display:flex;flex-direction:column;align-items:center;gap:12px}
  .mark img{height:64px}
  .word img{height:44px}
  .cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-subtle)}
</style></head>
<body>
  <div class="mark"><img src="../assets/logo-mark.svg" alt="Vestra mark"><span class="cap">Mark</span></div>
  <div class="mark word"><img src="../assets/logo-wordmark.svg" alt="Vestra Connect"><span class="cap">Wordmark · light</span></div>
</body></html>
